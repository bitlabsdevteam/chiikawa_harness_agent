name: Test and package

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, runpy
          version = runpy.run_path('chiikawa/_version.py')['__version__']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match package version'
          PY
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/build_release.py
      - run: python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        with:
          name: chiikawa-release
          path: dist/
          if-no-files-found: error

  sandbox-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m chiikawa --sandbox-setup
      - name: Verify real Docker isolation and terminal switching
        env:
          CHIIKAWA_TEST_DOCKER: '1'
        run: python -m unittest discover -s tests -p 'test_sandbox_docker.py' -v
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/build_release.py
      - name: Verify installed Sandbox runtimes
        env:
          CHIIKAWA_TEST_DOCKER: '1'
        run: python scripts/check_dist.py

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, sandbox-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chiikawa-release
          path: dist
      - name: Create draft with verified download assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "Chiikawa $RELEASE_TAG" --generate-notes
