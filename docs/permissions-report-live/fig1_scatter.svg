<text x='530.6' y='292.6' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Regex + LLM judge: 2.50 s, 2% allowed (1/43)</text>
<line x1='314.4' y1='291.9' x2='314.4' y2='246.5' stroke='#222222' stroke-width='1'/>
<line x1='310.8' y1='281.1' x2='325.1' y2='281.1' stroke='#222222' stroke-width='1'/>
<circle cx='314.4' cy='281.1' r='9' fill='#0072B2' stroke='white' stroke-width='1'/>
<text x='297.4' y='269.1' font-size='11' text-anchor='end' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Regex + Jev: 1.35 s, 5% allowed (2/43)</text>
<text x='620.0' y='70.0' font-size='12' text-anchor='start' fill='#222222' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>How to read it</text>
<text x='620.0' y='92.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Lower is safer, left is faster.</text>
<text x='620.0' y='108.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Lines = 95% intervals.</text>
<text x='620.0' y='124.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>The two models' safety gap</text>
<text x='620.0' y='140.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>(1 vs 2 of 43) is within noise.</text>
<text x='620.0' y='156.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'></text>
<text x='620.0' y='172.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Not shown: the regex's safe mode.</text>
<text x='620.0' y='188.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>It asks a human on 88% of calls, so it</text>
<text x='620.0' y='204.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>has no machine decision time.</text>
