<text x='340.0' y='330.0' font-size='11' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Median time per decision (wall clock; 95% bootstrap interval)</text>
<text x='22.0' y='176.0' font-size='11' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif' transform='rotate(-90 22.0 176.0)'>Dangerous calls allowed to run</text>
