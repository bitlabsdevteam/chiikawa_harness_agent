<svg xmlns='http://www.w3.org/2000/svg' width='960' height='400' viewBox='0 0 960 400'>
<rect width='100%' height='100%' fill='white'/>
<text x='480.0' y='24.0' font-size='15' text-anchor='middle' fill='#222222' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Cost: how cheap per token must Jev be to cost less than the LLM judge?</text>
<line x1='90.0' y1='56.0' x2='90.0' y2='316.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='90.0' y='331.0' font-size='10' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>0x</text>
<line x1='194.0' y1='56.0' x2='194.0' y2='316.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='194.0' y='331.0' font-size='10' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>2x</text>
<line x1='298.0' y1='56.0' x2='298.0' y2='316.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='298.0' y='331.0' font-size='10' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>4x</text>
<line x1='402.0' y1='56.0' x2='402.0' y2='316.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='402.0' y='331.0' font-size='10' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>6x</text>
<line x1='506.0' y1='56.0' x2='506.0' y2='316.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='506.0' y='331.0' font-size='10' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>8x</text>
<line x1='610.0' y1='56.0' x2='610.0' y2='316.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='610.0' y='331.0' font-size='10' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>10x</text>
<line x1='90.0' y1='316.0' x2='610.0' y2='316.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='84.0' y='319.0' font-size='10' text-anchor='end' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>0x</text>
<line x1='90.0' y1='251.0' x2='610.0' y2='251.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='84.0' y='254.0' font-size='10' text-anchor='end' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>0.4x</text>
<line x1='90.0' y1='186.0' x2='610.0' y2='186.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='84.0' y='189.0' font-size='10' text-anchor='end' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>0.8x</text>
<line x1='90.0' y1='121.0' x2='610.0' y2='121.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='84.0' y='124.0' font-size='10' text-anchor='end' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>1.2x</text>
<line x1='90.0' y1='56.0' x2='610.0' y2='56.0' stroke='#DDDDDD' stroke-width='1'/>
<text x='84.0' y='59.0' font-size='10' text-anchor='end' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>1.6x</text>
<text x='350.0' y='350.0' font-size='11' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>LLM output price / LLM input price  (r)</text>
<text x='22.0' y='186.0' font-size='11' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif' transform='rotate(-90 22.0 186.0)'>Jev price per token / LLM input price</text>
<polygon points='90,316 90.0,235.1 610.0,95.5 610,316' fill='#009E73' opacity='0.15'/>
<polyline points='90.0,235.1 610.0,95.5' fill='none' stroke='#009E73' stroke-width='3'/>
<text x='495.6' y='215.2' font-size='12' text-anchor='middle' fill='#009E73' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Jev is cheaper below the line</text>
<text x='350.0' y='78.0' font-size='12' text-anchor='middle' fill='#D55E00' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>LLM judge is cheaper above the line</text>
<circle cx='142.0' cy='221.1' r='6' fill='#222222' stroke='white' stroke-width='1'/>
<text x='151.0' y='213.1' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>r = 1: Jev must be &lt;= 0.58x</text>
<circle cx='298.0' cy='179.3' r='6' fill='#222222' stroke='white' stroke-width='1'/>
<text x='307.0' y='171.3' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>r = 4: Jev must be &lt;= 0.84x</text>
<circle cx='506.0' cy='123.4' r='6' fill='#222222' stroke='white' stroke-width='1'/>
<text x='497.0' y='143.4' font-size='11' text-anchor='end' fill='#222222' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>r = 8: Jev must be &lt;= 1.18x</text>
<circle cx='298.0' cy='294.6' r='8' fill='#D55E00' stroke='white' stroke-width='1'/>
<text x='310.0' y='298.6' font-size='11' text-anchor='start' fill='#D55E00' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>estimated prices: r = 4.0, Jev = 0.13x</text>
<line x1='90.0' y1='153.5' x2='610.0' y2='153.5' stroke='#888' stroke-width='1' stroke-dasharray='6 4'/>
<text x='96.0' y='148.5' font-size='10' text-anchor='start' fill='#555' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>same price per token as the LLM's input</text>
<text x='646.0' y='76.0' font-size='12' text-anchor='start' fill='#222222' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>How to read it</text>
<text x='646.0' y='98.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Per decision, Jev bills 413 input</text>
<text x='646.0' y='114.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>tokens; the LLM bills 205 in + 35.4 out.</text>
<text x='646.0' y='130.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'></text>
<text x='646.0' y='146.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Break-even Jev price (x LLM input):</text>
<text x='646.0' y='162.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>  (205 + 35.4 r) / 413</text>
<text x='646.0' y='178.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'></text>
<text x='646.0' y='194.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>LLM output is often priced several</text>
<text x='646.0' y='210.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>times its input (r about 4 to 8),</text>
<text x='646.0' y='226.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>so Jev only needs to be priced</text>
<text x='646.0' y='242.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>near the LLM's own rate.</text>
<text x='646.0' y='258.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'></text>
<text x='646.0' y='274.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Red dot: the estimated prices used.</text>
<text x='646.0' y='290.0' font-size='11' text-anchor='start' fill='#444' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Real prices may differ.</text>
</svg>
