<text x='40.0' y='352.0' font-size='11' text-anchor='start' fill='#222222' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Reading: at the Starter pack price, Jev costs less than the LLM judge for any LLM input price above about $0.78 per million (output at 4x).</text>
<text x='40.0' y='370.0' font-size='10' text-anchor='start' fill='#555' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Jev prices: jevmodel.org/pricing, page dated 24 Sep 2026; output tokens free. Uses the 413 billed Jev tokens per decision measured here, overhead included.</text>
<text x='40.0' y='386.0' font-size='10' text-anchor='start' fill='#555' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>The LLM judge's real price was not available: the headline verdict uses an ESTIMATE ($5 in / $20 out per M). Replace it with your invoice price.</text>
